  <circle cx="60" cy="58" r="34" fill="none" stroke="#f7f3ec" stroke-width="8" />
  <circle cx="60" cy="58" r="13" fill="#35e2a0" />
  <path fill="#f7f3ec" d="M83 79 100 104 74 90z" />
</svg>
