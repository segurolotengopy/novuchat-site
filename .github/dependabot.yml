# =============================================================================
# dependabot.yml — Actualización automática de dependencias y de pines por SHA
# Versión: 2.0 | Fecha: 2026-08-24 | Destino: .github/dependabot.yml
# -----------------------------------------------------------------------------
# Dependabot es gratuito en todos los planes y visibilidades. Aquí se configura:
#   - Un ecosistema por stack (elimine los que no apliquen al proyecto).
#   - Frecuencia semanal (lunes temprano, zona horaria de La Paz/CDMX).
#   - Agrupación de minor+patch en un solo PR para reducir ruido; los major
#     llegan en PR individuales para revisarlos con cuidado.
#   - Límite de PRs abiertos por ecosistema.
#   - `github-actions`: mantiene los pines por SHA de los workflows y actualiza
#     el comentario `# vX` automáticamente (Dependabot entiende el formato
#     `uses: owner/repo@SHA # vX.Y.Z`).
# Las actualizaciones de seguridad (security updates) se activan aparte en
# Settings → Code security → Dependabot security updates.
# =============================================================================
version: 2

updates:
  # ---- GitHub Actions: pines por SHA de todos los workflows -------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    # Cooldown: no adoptar una versión el día que sale. Una release
    # comprometida se detecta casi siempre en las primeras horas, que es
    # justo cuando Dependabot la propondría. Mismo criterio que el
    # `minimumReleaseAge` de pnpm, que ya frenó una instalación en este
    # repositorio (ver ESTADO.md, hallazgo 18).
    cooldown:
      default-days: 7
      # Solo `default-days`: este ecosistema no versiona con semver,
      # y Dependabot rechaza el archivo entero si se le pasan
      # `semver-*-days` aquí.
    open-pull-requests-limit: 5
    labels: [dependencias, github-actions, seguridad]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # ---- npm (Node / React / Vite) ---------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    # Cooldown: no adoptar una versión el día que sale. Una release
    # comprometida se detecta casi siempre en las primeras horas, que es
    # justo cuando Dependabot la propondría. Mismo criterio que el
    # `minimumReleaseAge` de pnpm, que ya frenó una instalación en este
    # repositorio (ver ESTADO.md, hallazgo 18).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    labels: [dependencias, npm]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    versioning-strategy: increase
    groups:
      npm-produccion-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      npm-desarrollo:
        dependency-type: development
        update-types: [minor, patch]
    # TypeScript mayor, en espera (revisar 2026-12-01).
    #
    # `@astrojs/check@0.9.10` declara `peer typescript: ^5.0.0 || ^6.0.0`, pero
    # el rango es optimista: con TS 6.0.3, `Astro.props` deja de resolverse y
    # `astro check` saca nueve `ts(7006)` en `.astro` cuyos Props SÍ están
    # tipados (`interface Props { preguntas: Pregunta[] }`).
    #
    # La tentación es anotar los nueve parámetros y seguir. Sería peor el
    # remedio: los errores desaparecerían dejando el chequeo de tipos de TODOS
    # los `.astro` apagado en silencio, porque el problema no son los
    # parámetros sino que las Props resuelven a `any`. Se espera a que las
    # herramientas de Astro admitan TS 6 de verdad.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

    # Sin más excepciones. `ignore` NO puede quedar como lista vacía:
    # Dependabot exige al menos un elemento y rechaza el archivo entero
    # («did not contain a minimum number of items 1»). Si hace falta una,
    # se descomenta el bloque y se revisa cada trimestre:
    #
    # ignore:
    #   - dependency-name: "firebase"
    #     update-types: ["version-update:semver-major"]

# Este repositorio NO declara ecosistemas pip, docker ni terraform.
#
# La plantilla del estándar los trae los cinco por defecto, y Dependabot no los
# ignora: intenta actualizarlos, no encuentra manifiesto y falla. El primer
# arranque tras arreglar el archivo dejó tres runs en rojo con
# «No Dockerfiles nor Kubernetes YAML found in /», y habría repetido cada
# semana. Se añaden de vuelta el día que exista un Dockerfile, un
# requirements.txt o un /infra.
