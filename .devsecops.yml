# Manifiesto del estándar DevSecOps (esquema: 02-pipelines/config/devsecops.schema.json;
# convenciones: 00-gobernanza/00-convenciones.md; generado por bootstrap-repo.sh v2.0)
version: 1
proyecto: novuchat-site
modo: A            # A | B | B0 (ver 00-gobernanza/03-ambientes-modos-y-aprobaciones.md)
cobertura_minima: 70
componentes:
  - nombre: novuchat-site
    ruta: ./
    stack: node
    proveedor: firebase
    # UN SOLO AMBIENTE (2026-09-03). Había un `staging` que apuntaba al mismo
    # proyecto y al mismo sitio en vivo que producción: no aislaba nada y hacía
    # creer que sí. Su papel lo cumple el canal de vista previa del PR.
    ambientes:
      production:
        proyecto: novuchat-site
        url: https://novuchat.site
        region: us-east1
seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]   # se puede endurecer (añadir MEDIUM), nunca relajar
  excepciones:                    # id, herramienta, componente, justificacion, aprobado_por, creado, vence
    - id: CVE-2026-41907
      herramienta: trivy
      componente: novuchat-site
      justificacion: >-
        uuid@9.0.1 llega como dependencia transitiva de firebase-admin
        (firebase-admin > @google-cloud/storage > gaxios > uuid) y no existe
        versión parcheada alcanzable: gaxios 6.x fija uuid ^9, y firebase-admin
        14.3.0 es la última publicada. No se puede forzar la versión sin salirse
        del rango que declara gaxios. El impacto real es nulo en este proyecto:
        las Functions no generan identificadores con uuid, solo lo hace el SDK
        internamente para trazas de peticiones. Se revisa cuando firebase-admin
        actualice gaxios.
      aprobado_por: Andres Alberdi
      creado: '2026-09-02'
      vence: '2026-12-01'
    - id: CKV_GHA_7
      herramienta: checkov
      componente: novuchat-site
      justificacion: >-
        Regla SLSA sobre workflow_dispatch con inputs, en tres grupos de workflows
        (revisado el 2026-10-01: ningun input se interpola en un script en ningun
        workflow de este repositorio). (1) release.yml declara `tipo`, un choice de
        [auto, patch, minor, major], y `prerelease`, un boolean: GitHub rechaza cualquier
        otro valor antes de que arranque, y `tipo` llega al shell por variable de entorno
        (TIPO_ENTRADA), no interpolado en el script. (2) ci-node-firebase.yml declara `tag`
        y `confirmar`, de texto: `confirmar` solo se compara con la cadena DESPLEGAR (en
        una condicion `if:`) y su valor no llega a ningun script; `tag` llega a
        actions/checkout (`ref:`) y a una variable de entorno (TAG) que el shell usa entre
        comillas, y antes de desplegar a produccion se exige que sea un tag existente
        (refs/tags/), sin guion (lo que descarta los prerelease y cualquier valor que
        empiece por -), ancestro de main y que quien lo lanza este en APROBADORES_PROD.
        (3) probar-identidad.yml declara `ambiente`, un choice con una sola opcion
        (production): solo se usa en `environment:`, en un `with:` y en un `env:` booleano,
        nunca dentro de un `run:`. Solo quien tiene permiso de escritura lanza un
        workflow_dispatch, y ese permiso ya permite ejecutar el workflow de su propia
        rama. Quitar los inputs obligaria a editar el workflow en cada release o despliegue
        manual.
      aprobado_por: Andres Alberdi
      creado: "2026-10-01"
      vence: "2026-12-30"
